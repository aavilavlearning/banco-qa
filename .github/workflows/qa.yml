name: QA BancoQA

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Tests (unit, API, E2E, caracterización)
        run: pytest -q --junitxml=reports/ci.xml

      - name: Trazabilidad (referencia; al terminar el M8 usa trazabilidad/matriz.csv)
        run: python trazabilidad/verificar_trazabilidad.py --matriz soluciones/modulo-8/matriz.csv --modulo 8

      # --- Opcional: anexo avanzado (guardrails y evals automatizados) ---
      # - name: Guardrails automatizados
      #   if: github.event_name == 'pull_request'
      #   run: python anexo-avanzado/harness/verificar_guardrails.py --base origin/${{ github.base_ref }} --matriz soluciones/modulo-8/matriz.csv --modulo 8
      # - name: Evals automatizadas
      #   run: python anexo-avanzado/evals/ejecutar_evals.py

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-qa
          path: reports/
